<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="watchtileTitle">
  <title id="watchtileTitle">Watchtile</title>
  <rect width="32" height="32" rx="8" fill="#F7F4EE"/>
  <!-- Two-stroke gable: mitered peak, open attic so it holds at 16px. -->
  <path
    d="M3.5 13.25 L16 3 L28.5 13.25"
    fill="none"
    stroke="#292524"
    stroke-width="2.5"
    stroke-linecap="butt"
    stroke-linejoin="miter"
    stroke-miterlimit="8"
  />
  <!-- Neighbourhood parcels under the eaves. Gutters are streets / lot lines. -->
  <rect x="3.5" y="15" width="14" height="6" rx="1.25" fill="#292524"/>
  <rect x="20" y="15" width="8.5" height="4.5" rx="1.25" fill="#292524"/>
  <rect x="3.5" y="22.5" width="14" height="6" rx="1.25" fill="#292524"/>
  <!-- Selected lot -->
  <rect x="20" y="21" width="8.5" height="7.5" rx="1.25" fill="#2563EB"/>
</svg>
