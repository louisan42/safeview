name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

jobs:
  api-unit:
    name: API unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r api/requirements-dev.txt
      - name: Fail if workflows echo a Postgres URL
        run: python3 scripts/check_secret_hygiene.py
      - name: Run tests with coverage
        env:
          PYTHONPATH: .
        run: |
          pytest api/tests -m "not integration" --cov=api --cov-report=xml --cov-report=term-missing --junit-xml=test-results.xml
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  api-integration:
    name: API integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_DB: sv
          POSTGRES_USER: sv
          POSTGRES_PASSWORD: sv
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U sv -d sv" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r api/requirements-dev.txt
      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Init database schema and seed
        env:
          PGPASSWORD: sv
        run: |
          until pg_isready -h localhost -p 5432 -U sv -d sv; do echo waiting for db; sleep 2; done
          psql -h localhost -p 5432 -U sv -d sv -f db/init/001_extensions.sql
          psql -h localhost -p 5432 -U sv -d sv -f db/init/002_schema.sql
          psql -h localhost -p 5432 -U sv -d sv -f db/init/003_seed.sql
      - name: Run integration tests
        env:
          PYTHONPATH: .
          PG_DSN: postgresql://sv:sv@localhost:5432/sv
        run: |
          pytest -m integration api/tests

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build
        working-directory: web
        env:
          VITE_API_BASE_URL: /api
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy Railway
    needs: [api-unit, api-integration, web-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    env:
      RAILWAY_PROJECT_ID: fb2ac2a8-5df1-4355-8979-7d484cb1db8e
      RAILWAY_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Mask Railway token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set +x
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "RAILWAY_TOKEN is not set on the GitHub Environment '${RAILWAY_ENVIRONMENT}'." >&2
            echo "Create a Railway project token for that environment and add it as a secret named RAILWAY_TOKEN." >&2
            exit 1
          fi
          echo "::add-mask::${RAILWAY_TOKEN}"
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy API
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set +x
          echo "::add-mask::${RAILWAY_TOKEN}"
          railway up --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service api --ci
      - name: Deploy web
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set +x
          echo "::add-mask::${RAILWAY_TOKEN}"
          railway up --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service web --ci
      - name: Health check
        env:
          API_URL: ${{ github.ref == 'refs/heads/main' && 'https://api-production-2c307.up.railway.app' || 'https://api-staging-5b49.up.railway.app' }}
          WEB_URL: ${{ github.ref == 'refs/heads/main' && 'https://web-production-69f87.up.railway.app' || 'https://web-staging-81f9.up.railway.app' }}
        run: |
          set -euo pipefail
          echo "Waiting for ${API_URL}/health"
          for i in $(seq 1 45); do
            if body="$(curl -fsS --max-time 10 "${API_URL}/health" 2>/dev/null)"; then
              echo "$body" | python3 -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('ok') else 1)"
              echo "API healthy"
              break
            fi
            echo "attempt ${i}/45 not ready yet"
            if [ "$i" -eq 45 ]; then
              echo "API health check timed out" >&2
              exit 1
            fi
            sleep 20
          done
          echo "Checking ${WEB_URL}"
          for i in $(seq 1 30); do
            code="$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "${WEB_URL}/" || true)"
            if [ "$code" = "200" ]; then
              echo "Web healthy (HTTP ${code})"
              exit 0
            fi
            echo "attempt ${i}/30 HTTP ${code}"
            sleep 10
          done
          echo "Web health check timed out" >&2
          exit 1
