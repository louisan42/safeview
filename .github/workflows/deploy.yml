# Health probe only — this workflow does not deploy.
# Production deploys from the CI "Deploy Railway" job on push to main.
# Staging deploys from the same job on push to staging.
# Do not log RAILWAY_TOKEN, PG_DSN, or DATABASE_URL.
name: Production health check

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  health:
    name: Check Railway production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      API_URL: https://api-production-2c307.up.railway.app
      WEB_URL: https://web-production-69f87.up.railway.app
    steps:
      - name: Wait for API /health
        run: |
          set -euo pipefail
          echo "Waiting for ${API_URL}/health"
          for i in $(seq 1 45); do
            if body="$(curl -fsS --max-time 10 "${API_URL}/health" 2>/dev/null)"; then
              echo "$body"
              echo "$body" | python3 -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('ok') else 1)"
              echo "API healthy"
              exit 0
            fi
            echo "attempt ${i}/45 not ready yet"
            sleep 20
          done
          echo "API health check timed out" >&2
          exit 1

      - name: Check web
        run: |
          set -euo pipefail
          echo "Checking ${WEB_URL}"
          for i in $(seq 1 30); do
            code="$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "${WEB_URL}/" || true)"
            if [ "$code" = "200" ]; then
              echo "Web healthy (HTTP ${code})"
              exit 0
            fi
            echo "attempt ${i}/30 HTTP ${code}"
            sleep 10
          done
          echo "Web health check timed out" >&2
          exit 1
