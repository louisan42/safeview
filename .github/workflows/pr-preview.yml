# Railway PR environments provision isolated API + web + PostGIS.
# This note is informational; Railway's GitHub app comments the live URLs.
name: PR preview note

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  comment:
    name: Comment staging preview notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## Staging preview',
              '',
              'Railway opens an isolated **PR environment** (not production) when this PR is opened.',
              '',
              '- Base environment: `staging` (own PostGIS — PRs cannot wipe production data)',
              '- Sign-in uses the **Clerk development** instance (`VITE_CLERK_PUBLISHABLE_KEY` / `pk_test_`)',
              '- Production still deploys only after merge to `main` and a green **CI** run (Wait for CI)',
              '- Railway comments the preview URLs on this PR when the environment is ready',
              '',
              'Project: https://railway.com/project/fb2ac2a8-5df1-4355-8979-7d484cb1db8e',
            ].join('\n')
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })
